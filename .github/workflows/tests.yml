name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: event_rms_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Die Integrationstests leeren TEST_DB_NAME bei jedem Lauf (Name muss «test» enthalten).
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: event_rms_ci
      DB_USER: root
      DB_PASS: root
      TEST_DB_NAME: event_rms_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd, mbstring, exif
          coverage: none

      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: JavaScript-Syntax prüfen
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Tests
        run: php tests/run.php
